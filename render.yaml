services:
  - type: web
    name: dana-quest-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000

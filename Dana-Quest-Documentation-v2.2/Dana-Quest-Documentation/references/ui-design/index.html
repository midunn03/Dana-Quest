add('welcome','S-01','Chào mừng','WF-01',['082'],['Ảnh mở đầu lớn như hierarchy Questo; dùng poster Dana và logo của bạn.','Lần đầu chỉ login/register. Không sao đánh giá, số lượt chơi hoặc giảm giá giả.','VI/EN ở đầu màn; trong prototype chỉ có mẫu VI, chưa dịch toàn bộ.'],'Kiểm tra phiên → loading; có session thiếu avatar → S-03; đã logout → guest browse.',()=>`<div class="scene"><img class="logo" src="../brand/001.png" alt="Dana Quest"><span class="pill" style="position:absolute;right:18px;top:15px;z-index:2">VI / EN</span></div><div class="welcome"><h2>Mỗi góc phố,<br>một điều để khám phá.</h2><p>Đi theo câu chuyện của riêng bạn<br>giữa lòng Đà Nẵng.</p><div class="stack">${go('login','Đăng nhập')}${go('register','Tạo tài khoản','btn secondary')}</div></div>`);
add('login','S-02a','Đăng nhập','WF-02',['092','062'],['Form thoáng từ sheet Questo, dùng tài khoản hiện có. Không OAuth hoặc booking chưa triển khai.','Label ngoài trường; lỗi sát trường; sau auth quay ý định hợp lệ.','Prototype không xác thực, không nhập thông tin thật.'],'Rỗng / sai / pending / lỗi kết nối / 429. Không chuyển màn nếu auth thật lỗi.',()=>`<div class="content">${screenTop('Tài khoản','welcome')}<h2>Chào bạn trở lại.</h2><p class="muted">Tiếp tục những hành trình còn đang chờ.</p><label class="field">Tên đăng nhập<input placeholder="Nhập tên đăng nhập" autocomplete="off"></label><label class="field">Mật khẩu<input type="password" placeholder="Nhập mật khẩu" autocomplete="off"></label><p class="small muted">Bản thiết kế: không nhập tài khoản thật.</p><div style="height:18px"></div>${go('explore','Đăng nhập')}<div class="divider"></div>${go('register','Tạo tài khoản','btn quiet')}<div class="notice">Camera và vị trí chỉ được hỏi khi bạn dùng tính năng liên quan.</div></div>`);
add('register','S-02b','Tạo tài khoản','WF-02',['092'],['Tên và password là tối thiểu; liên hệ bổ sung sau nếu cần.','Avatar ở bước kế, không bắt ảnh mặt/camera.','Thông báo privacy phải dẫn đến nội dung thật khi app triển khai.'],'Trùng tên / password sai / pending / mất kết nối; chưa commit không chuyển avatar.',()=>`<div class="content">${screenTop('Tạo tài khoản','login')}<h2>Hành trình bắt đầu<br>từ bạn.</h2><p class="muted">Giữ tiến độ và kỷ niệm của riêng mình.</p><label class="field">Tên đăng nhập<input placeholder="Chọn tên của bạn"></label><label class="field">Mật khẩu<input type="password" placeholder="Tạo mật khẩu"></label><div class="notice">Ảnh và lịch sử được giữ riêng theo tài khoản.</div><div style="height:24px"></div>${go('avatar','Tạo tài khoản')}<p class="small muted">Bản thiết kế không tạo tài khoản.</p>${go('login','Đã có tài khoản? Đăng nhập','btn quiet')}</div>`);
add('avatar','S-03','Nhân vật của bạn','WF-03',[],['Thiết kế riêng Dana theo yêu cầu, không phải màn pixel được chứng minh trong Questo.','Preview lớn, bốn mẫu chọn. Custom tóc/quần áo tự do chưa duyệt.','SVG ở đây là phác thảo. Chỉ xác nhận mới ghi vào account khi làm app.'],'Chưa chọn / đã chọn / pending / save lỗi; hủy giữ avatar cũ.',()=>`<div class="content">${screenTop('Nhân vật của bạn','register')}<h2>Bạn sẽ là ai<br>trong chuyến đi này?</h2><p class="muted">Chọn một người bạn đồng hành.</p><div class="plinth" id="avatar-preview">${avatar()}</div><div class="avatar-grid">${['#39765d','#38697a','#b07a3d','#84678c'].map((c,i)=>`<button class="avatar-choice ${i===0?'on':''}" data-avatar="${c}" aria-label="Nhân vật ${i+1}">${avatar(c)}</button>`).join('')}</div><p class="small muted" style="text-align:center">Có thể đổi trong Tài khoản.</p><div style="height:18px"></div>${go('explore','Xác nhận nhân vật')}</div>`);
add('explore','S-04','Explore / Danh sách','WF-04',['014','002','040'],['Giữ thứ tự vùng → List/Map → search → card của Questo, bỏ banner giảm giá/giá mua.','Hai thử thách trên card là hướng nội dung; không bịa rating/thời lượng/khoảng cách.','Tìm kiếm prototype lọc tên card; danh mục nâng cao chỉ minh họa.'],'Loading catalog / không khớp / catalog lỗi / guest sau logout. Tile lỗi khác catalog lỗi.',()=>`<div class="content"><div class="top"><span class="pill">${icon('pin')} Đà Nẵng</span>${go('account','Tài khoản','iconbtn','user')}</div><h2>Hôm nay, đi đâu?</h2><p class="muted">Một câu chuyện mới, ngay quanh bạn.</p><div class="tabs">${go('explore','Danh sách','on')}${go('map','Bản đồ','','map')}</div><label class="search">${icon('search')}<input id="quest-search" placeholder="Tìm quest hoặc địa điểm" aria-label="Tìm quest"></label><div class="chips"><span class="chip on">Tất cả</span><span class="chip">Văn hóa</span><span class="chip">Ngoài trời</span></div><div id="quest-cards">${card('Dấu chân bên Cầu Rồng','cau-rong')}${card('Một buổi sáng ở Mỹ Khê','bai-bien-my-khe')}${card('Những nếp gấp APEC','cong-vien-apec')}</div><p id="no-results" class="notice" hidden>Chưa có quest khớp tên bạn tìm.</p></div>`,{nav:'explore'});
add('map','S-05','Explore / Bản đồ','WF-04',['037','046'],['Map lớn, locate trên đầu và thẻ quest dưới theo cấu trúc Questo.','Sơ đồ ở đây chỉ để duyệt bố cục, không phải tọa độ/tiles thật. App phải tái sử dụng map Dana ZIP.','Không tuyến/khoảng cách/vùng phủ giả; attribution runtime luôn đọc được.'],'Chờ GPS / denied / sai số lớn / tile lỗi. Nút locate mở variant V-03.',()=>`<div class="map">${map()}<div class="map-controls">${go('explore','Danh sách','iconbtn','back')}<span class="pill">${icon('pin')} Đà Nẵng</span>${go('gps-denied','Định vị','iconbtn','pin')}</div><button class="pin" data-go="detail" aria-label="Chọn quest Cầu Rồng">${icon('flag')}</button><div class="map-card"><img src="assets/cau-rong.jpg" alt="Cầu Rồng"><h3>Dấu chân bên Cầu Rồng</h3><p class="small muted">2 thử thách · Đà Nẵng</p><div style="clear:both"></div>${go('detail','Xem quest')}</div></div>`,{nav:'explore'});
add('detail','S-06','Chi tiết quest','WF-05',['016','026','027'],['Cover lớn, intro/việc cần làm/safety, CTA cố định đáy.','Quest Cầu Rồng là nội dung mẫu để duyệt UI, chưa là nội dung chính thức.','Guest đọc được sau logout; start login gate. Có run dở dùng Tiếp tục.'],'Public / guest start / run dở / chưa ready. Prototype có variant login gate.',()=>`<img class="cover" src="assets/cau-rong.jpg" alt="Cầu Rồng"><div class="detail-top">${go('explore','Quay lại','iconbtn','back')}<span class="pill">2 thử thách</span></div><div class="content"><span class="tag">Khám phá tại chỗ</span><h2>Dấu chân<br>bên Cầu Rồng</h2><p class="muted">Chậm lại bên sông Hàn. Quan sát những điều quen thuộc bằng một góc nhìn mới.</p><h3>Bạn sẽ làm gì?</h3><div class="listrow"><span class="tag">1</span>Quan sát và giải một câu đố ngắn.</div><div class="listrow"><span class="tag">2</span>Lưu một góc nhìn đáng nhớ.</div><h3>Trước khi bắt đầu</h3><div class="notice">Chỉ dừng ở nơi được phép. Không sử dụng điện thoại khi băng đường.</div><p class="small muted">Nội dung mẫu cần duyệt trước triển khai.</p></div>`,{footer:()=>go('briefing','Xem điểm bắt đầu')});
add('quests','S-07','Quest của tôi','WF-11 / WF-12',['025','042'],['Giữ Quests/Memories từ Questo; bỏ invite/mã booking/số km chưa đo.','Card có trạng thái, số bước đã xác nhận và Resume; tách hoàn tất với đang chơi.','Số 1/2 trong mockup là dữ liệu mẫu.'],'Guest login / empty / loading / run dở / completed / read lỗi.',()=>`<div class="content"><h2>Quest của tôi</h2><p class="muted">Những chuyến đi vẫn còn tiếp nối.</p><div class="tabs">${go('quests','Hành trình','on')}${go('album','Kỷ niệm')}</div><h3>Đang khám phá</h3><div class="card"><img src="assets/cau-rong.jpg" alt="Cầu Rồng"><div class="card-info"><span class="tag">Đang chơi · mẫu</span><h3>Dấu chân bên Cầu Rồng</h3><p class="small muted">Đã hoàn thành 1 / 2 thử thách</p><div class="progress"><i></i></div>${go('story','Tiếp tục hành trình')}</div></div><p class="small muted">Tiến độ thực tế chỉ hiển thị sau xác nhận máy chủ.</p></div>`,{nav:'quests'});
add('briefing','S-08','Chuẩn bị / Điểm bắt đầu','WF-06',['031','028','044','043'],['Photo/Map là ảnh nhận diện của dự án, không phải ảnh player.','Không thêm timer/team/offline khi policy chưa duyệt.','Vị trí đứng/lối vào cần nguồn và kiểm tra thật; ở đây không có GPS.'],'Chờ vị trí / quá xa / đã gần / chưa xác định. Start policy O-04.',()=>`<div class="content">${screenTop('Điểm bắt đầu','detail')}<h2>Tìm nơi câu chuyện<br>bắt đầu.</h2><div class="tabs"><button class="on" data-note="Ảnh nhận diện do dự án cung cấp, không phải ảnh player.">Ảnh nhận diện</button>${go('map','Bản đồ')}</div>${pic()}<strong>Khu vực Cầu Rồng</strong><p class="small muted">Điểm đứng và lối vào cần được xác minh trước phát hành.</p><div class="notice"><strong>Đi chậm và quan sát.</strong><br>Giữ lối đi thông thoáng, tôn trọng nội quy tại địa điểm.</div><p class="small muted">Chưa có vị trí thật trong bản thiết kế.</p></div>`,{footer:()=>go('story','Xem luồng bắt đầu')});
add('story','S-09','Story / Câu chuyện','WF-07',['067','075','054'],['Giữ Story → chỉ dẫn → challenge của Questo; nền xanh đậm thay tím.','Header chỉ bước hiện tại/menu, không timer/100 điểm giả.','Continue không thưởng; mời ảnh kỷ niệm là lựa chọn riêng có thể bỏ qua.'],'Nội dung dài / thiếu EN / load lỗi / paused. Không coi story là challenge.',()=>`${head()}<div class="content"><p class="small muted">Dấu chân bên Cầu Rồng</p>${pic()}<h2>Một góc nhìn mới</h2><p class="story">Có những điều ta đi qua mỗi ngày nhưng hiếm khi dừng lại để nhìn kỹ.</p><p class="story">Từ một vị trí an toàn bên sông, hãy quan sát hình dáng cây cầu và những đường nét quanh bạn.</p><div class="notice">Đoạn truyện minh họa để duyệt bố cục.</div></div>`,{dark:true,footer:()=>`<div class="stack">${go('challenge','Tiếp tục')}${go('photo','Lưu một kỷ niệm','btn secondary','camera')}</div>`});
add('challenge','S-10','Thử thách / Trả lời','WF-07 / WF-08',['065','071'],['Prompt/ảnh clue/input/check/help tách rõ như Questo.','Ảnh clue chỉ xem và phóng to khi triển khai, không upload.','Prototype chỉ chuyển trạng thái mẫu, không đánh giá đáp án hoặc cấp xu.'],'Input rỗng / pending / sai / đúng / mạng lỗi / hint. Wrong khác server error.',()=>`${head()}<div class="content"><p class="small muted">Thử thách 1 · Quan sát</p><h2>Bạn nhìn thấy gì<br>khi dừng lại?</h2>${pic()}<p>Quan sát chi tiết được tác giả chỉ dẫn tại điểm đến và nhập câu trả lời.</p><label class="field">Câu trả lời của bạn<input placeholder="Nhập câu trả lời mẫu"></label>${go('help','Cần gợi ý?','btn secondary','help')}</div>`,{dark:true,footer:()=>go('wrong','Xem trạng thái kiểm tra')});
add('photo','S-11a','Ảnh kỷ niệm / Mời chụp','WF-09 / PH-01',['077','032','052'],['Kỷ niệm không phải điều kiện giải câu đố. Để sau không bị phạt theo đề xuất.','Chỉ click Mở camera mới xin quyền ở app thật. Mockup không gọi camera.','Ảnh private mặc định, không lấy chương trình thưởng chia sẻ của Questo.'],'Chưa xin quyền / pending / denied / bận / fallback file.',()=>`${head()}<div class="content">${pic()}<h2>Giữ lại<br>khoảnh khắc này.</h2><p class="story">Một tấm ảnh cho hành trình của riêng bạn.</p><div class="notice">Ảnh chỉ dành cho bạn. Bạn có thể chụp sau và tiếp tục câu chuyện.</div><div style="height:22px"></div><div class="stack">${go('camera','Mở camera','btn','camera')}${go('draft','Chọn ảnh từ thiết bị','btn secondary','image')}${go('story','Để sau','btn secondary')}</div></div>`,{dark:true});
add('camera','S-11b','Camera / Khung chụp','WF-09',['032','077'],['Khung ảnh thay thế camera để duyệt layout, không live video.','Shutter/hủy rõ; không microphone. App phải dừng tracks khi rời/ẩn/logout.','Chụp chỉ chuyển draft, chưa saved.'],'Live / không thiết bị / bận / denied; không tự xin quyền.',()=>`<div class="camera"><img src="assets/cau-rong.jpg" alt="Hình minh họa khung camera"><span class="camera-label">Khung chụp minh họa · chưa lưu</span>${go('draft','Chụp','shutter','camera')}<div style="padding:0 22px">${go('photo','Hủy chụp','btn secondary')}</div></div>`,{dark:true});
add('draft','S-11c','Xem trước / Chưa lưu','WF-09',['077'],['Preview lớn, nhãn Chưa lưu; retake không xóa ảnh cũ. Đây là chi tiết Dana bổ sung.','Lưu và complete là hai hành động khác nhau.','Lưu lỗi giữ draft trong phiên hiện tại, không hứa refresh-safe.'],'Processing / review quality / saving / upload fail / saved.',()=>`<div class="content">${screenTop('Xem trước ảnh','photo')}<span class="tag">Ảnh kỷ niệm · Chưa lưu</span>${pic(350)}<div class="notice">Riêng tư theo mặc định.<br>Chỉ xuất hiện trong album sau khi lưu thành công.</div><p class="small muted">Không AI xác minh địa danh.</p></div>`,{footer:()=>`<div class="stack">${go('memory-saved','Xem trạng thái đã lưu')}${go('camera','Chụp lại','btn secondary')}</div>`});
add('album','S-12','Album / Kỷ niệm riêng','WF-10',['025','052'],['Album cá nhân, không community feed. Ảnh mẫu trong mockup không thuộc player.','Timestamp lưu không tự là ngày chụp. Xóa có xác nhận, không thu hồi coin theo policy đề xuất.','App phải fetch metadata và content đúng owner, xử lý lỗi từng ảnh.'],'Guest / empty / loading / blob lỗi / xóa pending/error.',()=>`<div class="content">${screenTop('Kỷ niệm của tôi','account')}<h2>Mang một chút<br>Đà Nẵng về nhà.</h2><div class="notice">Chỉ bạn xem được album của mình.</div><div class="memory"><div><img src="assets/cau-rong.jpg" alt="Ảnh mẫu Cầu Rồng"><p><strong>Cầu Rồng</strong><br>Ảnh mẫu thiết kế</p>${go('delete','Xóa ảnh mẫu','btn secondary')}</div><div><img src="assets/bai-bien-my-khe.jpg" alt="Ảnh mẫu Mỹ Khê"><p><strong>Mỹ Khê</strong><br>Ảnh mẫu thiết kế</p></div></div><p class="small muted">Ảnh lấy từ tài nguyên dự án, không phải dữ liệu người dùng thật.</p></div>`,{nav:'account'});
add('result','S-13','Kết thúc quest','WF-12',[],['Màn Dana thiết kế mới; không khẳng định bộ ảnh Questo có cùng màn tổng kết.','Không gán coin khi policy chưa duyệt; 2/2 chỉ là trạng thái layout mẫu.','Mở lại kết quả không thưởng lặp.'],'Solved all / with skips / reward pending/error / đã nhận.',()=>`<div class="content" style="text-align:center">${screenTop('Hành trình của bạn','quests')}<div class="success">${icon('flag')}</div><h2>Một câu chuyện<br>để mang về.</h2><p class="muted">Dấu chân bên Cầu Rồng</p><div class="stats"><div><strong>2 / 2</strong><span class="small">Thử thách mẫu</span></div><div><strong>—</strong><span class="small">Xu theo luật duyệt</span></div></div><div class="notice">Bố cục tổng kết minh họa.<br>Không ghi thưởng hoặc tiến độ thật.</div><div style="height:28px"></div><div class="stack">${go('album','Xem kỷ niệm')}${go('explore','Khám phá quest khác','btn secondary')}</div></div>`);
add('shop','S-14','Cửa hàng Green Coin','WF-12',[],['Thiết kế riêng Dana thay Crew, không có màn coin shop tương đương được chứng minh từ ảnh.','Số dư/item/cost mẫu được ghi rõ. Không voucher thật hoặc mua coin.','Đổi cần confirm rồi backend check balance/unique transaction.'],'Guest / thiếu coin / đủ coin / đã đổi / lỗi request.',()=>`<div class="content"><h2>Một chút xanh,<br>một món quà nhỏ.</h2><p class="muted">Cửa hàng Green Coin demo</p><div class="balance"><span class="small">Số dư minh họa</span><strong>120 <span style="font-size:15px">Green Coins</span></strong><span class="small muted">Không phải tiền thật</span></div><div class="reward"><div class="art">${icon('image')}</div><div><h3>Bưu thiếp Đà Nẵng</h3><p>Vật phẩm mẫu để duyệt bố cục.</p><button data-go="redeem">30 xu mẫu · Xem đổi</button></div></div><div class="reward"><div class="art">${icon('flag')}</div><div><h3>Dấu chân nhà khám phá</h3><p>Huy hiệu minh họa.</p><button data-go="redeem">50 xu mẫu · Xem đổi</button></div></div><p class="small muted">Các mức giá chưa phải chính sách được duyệt.</p></div>`,{nav:'shop'});
add('account','S-15','Tài khoản / Cài đặt','WF-03 / WF-13',['007','010','078'],['Giữ profile/settings của Questo nhưng gọn lại: avatar, album, locale, privacy, logout.','Bỏ crew/leaderboard/subscription. Không trường hoặc metric không có dữ liệu.','VI/EN là yêu cầu app; prototype hiện chỉ minh họa VI, không giả đã tích hợp i18n.'],'Authenticated / guest sau logout / session expired / profile save error.',()=>`<div class="content"><h2>Tài khoản</h2><div class="listrow">${avatar()}<div><h3>Bạn đồng hành</h3><span class="small muted">Hồ sơ minh họa</span></div></div><div style="height:18px"></div>${go('avatar','Đổi nhân vật','btn secondary')}<div class="listrow">${icon('camera')}<span class="grow">Kỷ niệm của tôi</span><button data-go="album">Mở</button></div><div class="listrow">${icon('book')}<span class="grow">Quest của tôi</span><button data-go="quests">Mở</button></div><div class="listrow">${icon('user')}<span class="grow">Ngôn ngữ</span><button data-note="Sản phẩm yêu cầu VI/EN; prototype này đang dùng tiếng Việt để duyệt layout.">Tiếng Việt / EN</button></div><div class="listrow"><span class="grow">Quyền riêng tư</span><button data-note="Ảnh private; retention/xóa account cần quyết định O-06.">Xem</button></div><div style="height:24px"></div>${go('guest','Xem trạng thái đăng xuất','btn secondary')}</div>`,{nav:'account'});
add('help','S-16','Trợ giúp trong quest','WF-08 / WF-13',['071','055','063','057'],['Help sheet tham khảo Questo: hint/skip/report.','Không tự đặt quota/penalty/price khi O-03 chưa chốt.','Đóng sheet không thay run; backend report chưa có thì không báo ticket gửi thành công.'],'Hint confirm / skip confirm / nhóm report / cancel.',()=>`<div class="sheet-bg"><div style="opacity:.35">${head()}<div class="content">${pic()}<h2>Thử thách 1</h2></div></div><section class="sheet"><h2>Bạn cần một chút<br>trợ giúp?</h2><p>Chọn cách phù hợp để tiếp tục chuyến đi.</p><div class="stack">${go('hint','Xem gợi ý','btn secondary','help')}${go('skip','Bỏ qua thử thách','btn secondary')}${go('report','Báo vấn đề','btn secondary','flag')}${go('challenge','Quay lại thử thách','btn quiet')}</div></section></div>`,{dark:true});

let current=new URLSearchParams(location.search).get('screen')||'explore';let board=false;
function device(s){return `<section><h2 class="board-label">${s.code} / ${s.title}</h2><div class="device ${s.dark?'play':''}"><div class="status"><span>9:41</span><span>● ▰ ▰</span></div><div class="body">${s.body()}</div>${s.footer?`<div class="footer">${s.footer()}</div>`:''}${s.nav?nav(s.nav):''}</div><p class="caption">${s.code} · ${s.wf} · đề xuất Dana Quest</p></section>`}
function show(id){current=screens.some(s=>s.id===id)?id:'explore';board=false;document.body.classList.remove('board');window.scrollTo(0,0);const s=screens.find(s=>s.id===current);document.getElementById('sidebar').innerHTML=screens.map(x=>`<button class="${x.id===current?'on':''}" data-go="${x.id}">${x.code} / ${x.title}</button>`).join('');document.getElementById('review').innerHTML=device(s)+`<aside class="notes"><span class="tag">${s.code} / ${s.wf}</span><h2>${s.title}</h2><p>Thiết kế Dana Quest dựa trên cấu trúc tham khảo, không phải bản sao hoặc chức năng đã triển khai.</p><div class="notebox"><h3>Ghi chú cho agent</h3><ol>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ol></div><div class="notebox"><h3>Trạng thái cần xử lý</h3><p class="small">${s.states}</p></div><p class="ref">Nguồn ảnh: ${s.refs.length?s.refs.map(n=>`<a href="../questo/${n}.png" target="_blank" rel="noopener">${n}.png</a>`).join(' '):'Thiết kế riêng Dana, chưa có màn tương đương được xác nhận trong ảnh Questo.'}</p><div class="variants">${['gate','gps-denied','camera-denied','upload-failed','evidence'].map(id=>`<button data-go="${id}">${screens.find(x=>x.id===id).title}</button>`).join('')}</div><p class="small"><a href="SCREEN-SPECS.md">Đọc đặc tả và cách bàn giao</a> · <a href="../INDEX.md">Nguồn tham khảo</a></p></aside>`;document.getElementById('all').textContent='Xem toàn bộ màn';document.getElementById('message').textContent='Các nút chỉ chuyển màn thiết kế. Không có dữ liệu thật được ghi.';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){show(b.dataset.go);return}const a=e.target.closest('[data-avatar]');if(a){document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('on'));a.classList.add('on');document.getElementById('avatar-preview').innerHTML=avatar(a.dataset.avatar);return}const n=e.target.closest('[data-note]');if(n)document.getElementById('message').textContent=n.dataset.note});
document.addEventListener('input',e=>{if(e.target.id==='quest-search'){const q=e.target.value.trim().toLocaleLowerCase('vi');let n=0;document.querySelectorAll('#quest-cards .card').forEach(c=>{const yes=c.textContent.toLocaleLowerCase('vi').includes(q);c.style.display=yes?'block':'none';if(yes)n++});document.getElementById('no-results').hidden=n!==0}});
document.getElementById('all').onclick=()=>{if(board){show(current);return}board=true;document.body.classList.add('board');document.getElementById('review').innerHTML=screens.map(device).join('');document.getElementById('all').textContent='Xem từng màn';document.getElementById('message').textContent=`${screens.length} màn và biến thể; các nút vẫn chuyển về chế độ từng màn.`};show(current);
</script></body></html>

<title id="if-notification-inbox-t">Notification inbox</title>
<desc id="if-notification-inbox-d">A notifications panel with two unread rows marked by teal dots and a count of 2. A cursor clicks Mark all read and the dots clear, then marks the same two rows unread again.</desc>

<title id="if-usage-meter-t">Usage meter</title>
<desc id="if-usage-meter-d">An API calls card at 8,420 of 10,000. A new month resets it to 1,200, then a cursor clicks Import data and the teal bar fills back to 84% as the count climbs.</desc>
